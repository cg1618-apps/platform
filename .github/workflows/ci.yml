name: Tests

# Pull requests only, and ubuntu-latest only. The self-hosted runner is a
# machine in a house, every repository in this organisation is public, and a
# fork's pull request running on it is the standard catastrophe. No
# pull_request-triggered job may ever name it - in this repository or any app's.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Runs the schema check and the policy check against the committed
      # registry, which is what the box will later derive its ingress from.
      - name: Validate the registry
        run: python bin/validate_apps.py

      # The ingress that will be served is a committed, generated file. This is
      # what stops it being hand-edited into routing a hostname nobody decided
      # to route.
      - name: Check the generated ingress matches the registry
        run: python bin/generate_ingress.py --check

      # The apex page is the other generated artefact. Same reasoning: the page
      # that will be served appears in the diff where a person reads it.
      - name: Check the generated apex page matches the registry
        run: python bin/generate_apex.py --check

      - name: Run the tests
        run: python -m pytest tests/ -q

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      # Found by shebang rather than by extension. The scripts in bin/ are
      # commands, run as `bin/deploy media`, and carry no .sh - so a bin/*.sh
      # glob lints none of them while looking like it lints them all. The
      # empty guard stays for the reason it was written: an unguarded list
      # fails the job on a repository that has no scripts.
      - name: Lint the shell scripts
        run: |
          mapfile -t scripts < <(grep -rls '^#!/usr/bin/env bash' bin/ || true)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts yet."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck "${scripts[@]}"
