name: Tests

# Pull requests only, and ubuntu-latest only. The self-hosted runner is a
# machine in a house, every repository in this organisation is public, and a
# fork's pull request running on it is the standard catastrophe. No
# pull_request-triggered job may ever name it - in this repository or any app's.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Runs the schema check and the policy check against the committed
      # registry, which is what the box will later derive its ingress from.
      - name: Validate the registry
        run: python bin/validate_apps.py

      # The ingress that will be served is a committed, generated file. This is
      # what stops it being hand-edited into routing a hostname nobody decided
      # to route.
      - name: Check the generated ingress matches the registry
        run: python bin/generate_ingress.py --check

      # The apex page is the other generated artefact. Same reasoning: the page
      # that will be served appears in the diff where a person reads it.
      - name: Check the generated apex page matches the registry
        run: python bin/generate_apex.py --check

      - name: Run the tests
        run: python -m pytest tests/ -q

      # Pinned in requirements-dev.txt rather than floating: ruff's default
      # rule set changes between releases, so an unpinned lint step fails a
      # pull request that changed nothing about the code.
      - name: Lint
        run: ruff check .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      # Found by shebang rather than by extension. The scripts in bin/ are
      # commands, run as `bin/deploy media`, and carry no .sh - so a bin/*.sh
      # glob lints none of them while looking like it lints them all. The
      # empty guard stays for the reason it was written: an unguarded list
      # fails the job on a repository that has no scripts.
      #
      # By FIRST line, and by more than one shebang. `grep -rl` matched the
      # pattern anywhere in a file, missed `#!/bin/bash`, `#!/bin/sh` and
      # `#!/usr/bin/env sh` entirely, and recursed into __pycache__ - the same
      # "looks thorough, lints nothing" shape the shebang search replaced.
      - name: Lint the shell scripts
        run: |
          scripts=()
          while IFS= read -r -d '' f; do
            case "$(head -n 1 "$f")" in
              '#!'*/sh|'#!'*/sh\ *|'#!'*/bash|'#!'*/bash\ *|'#!'*env\ sh|'#!'*env\ bash)
                scripts+=("$f") ;;
            esac
          done < <(find bin -type f -not -path '*/__pycache__/*' -print0)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts yet."
            exit 0
          fi
          echo "linting: ${scripts[*]}"
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck "${scripts[@]}"

      # Everything above reads the stack's files. Nothing above STARTS it,
      # and that gap took the tunnel down: a change that moved the apex and
      # cloudflared mounts passed every check here, merged, and then failed
      # on the box with "read-only file system" because runc could not create
      # a mountpoint inside a read-only mount. Every hostname went with it.
      #
      # `docker compose up -d` is the whole guard. It returned non-zero on
      # the box for exactly that reason, so running it here would have
      # failed this job instead of production.
      #
      # Dummy credentials: the tunnel cannot connect from a hosted runner and
      # is not meant to. What is being proved is that every container STARTS -
      # mounts resolved, paths present, config parsed - which is the class of
      # failure that reaches the box.
      - name: Smoke-test the shared stack
        run: |
          set -euo pipefail

          printf '{"AccountTag":"ci","TunnelSecret":"ci","TunnelID":"ci"}\n' \
            > "${GITHUB_WORKSPACE}/.ci-credentials.json"

          cat > .env <<EOF
          # The name the box uses, so container names and the network match
          # what production has rather than the CI directory name.
          COMPOSE_PROJECT_NAME=cg1618
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci
          TUNNEL_ID=00000000-0000-0000-0000-000000000000
          CLOUDFLARED_CREDENTIALS=${GITHUB_WORKSPACE}/.ci-credentials.json
          # Grafana interpolates this with :? in the compose file, so an
          # absent value fails the whole compose up rather than falling back
          # to admin/admin. That refusal is deliberate, which means CI has to
          # supply a value.
          #
          # No backticks anywhere in this heredoc: it is unquoted, so the
          # shell runs command substitution inside it, and a backtick in a
          # COMMENT is still a command.
          GRAFANA_ADMIN_PASSWORD=ci
          EOF

          # The step that would have caught the outage.
          docker compose -f docker-compose.prod.yml up -d

          # Started, not healthy. cloudflared cannot authenticate here and
          # will restart-loop; that is expected and is not what is under
          # test. A container that never started has the zero time here, and
          # that is what a bad mount produces.
          for c in cg1618-db-1 cg1618-cloudflared-1 cg1618-apex-1 cg1618-loki-1 cg1618-alloy-1 cg1618-grafana-1; do
            started="$(docker inspect -f '{{.State.StartedAt}}' "$c")"
            echo "${c} started at ${started}"
            case "${started}" in
              0001-01-01*) echo "${c} never started"; exit 1 ;;
            esac
          done

          # The apex mounts are directories, and this is what proves they
          # resolve to the committed files rather than to an empty directory
          # docker helpfully created. A single-file mount that has gone stale
          # fails here too.
          docker compose -f docker-compose.prod.yml exec -T apex \
            cat /usr/share/nginx/html/index.html > /tmp/served.html
          diff apex/html/index.html /tmp/served.html

          # nginx parsed the mounted config and answers its own health probe.
          for _ in $(seq 1 20); do
            status="$(docker inspect -f '{{.State.Health.Status}}' cg1618-apex-1)"
            [ "${status}" = "healthy" ] && break
            echo "apex: ${status}"
            sleep 3
          done
          [ "${status}" = "healthy" ]

      # Started is not enough for these two: a Loki with a schema it cannot
      # query accepts writes and comes up healthy, and a Grafana whose
      # provisioned datasource is malformed serves its UI perfectly while
      # every dashboard is empty. Both failures reach the box looking fine.
      # Started is not enough for any of this. A Loki whose schema cannot be
      # queried accepts writes and looks fine; a Grafana whose provisioned
      # datasource failed to parse serves its UI perfectly with every
      # dashboard empty. Both reach the box looking healthy.
      #
      # Every probe runs INSIDE the grafana container. It is on the cg1618
      # network and has a shell; the loki image is distroless and has neither
      # a shell nor wget, which is why Loki carries no healthcheck.
      - name: Prove Loki answers and Grafana found its datasource
        run: |
          set -euo pipefail

          GF=(docker compose -f docker-compose.prod.yml exec -T grafana)

          for _ in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' cg1618-grafana-1)"
            [ "${status}" = "healthy" ] && break
            echo "grafana: ${status}"
            sleep 3
          done
          [ "${status}" = "healthy" ]

          # Loki's own readiness, probed across the network from grafana.
          for _ in $(seq 1 40); do
            ready="$("${GF[@]}" wget -q -O - 'http://loki:3100/ready' || true)"
            echo "loki/ready: ${ready}"
            case "${ready}" in *ready*) break ;; esac
            sleep 3
          done
          case "${ready}" in *ready*) ;; *) echo "loki never became ready"; exit 1 ;; esac

          # The provisioned datasource, read back from Grafana's own API. A
          # datasource file that failed to parse leaves Grafana running and
          # healthy with no datasource at all, saying so only in its log.
          #
          # An Authorization header rather than userinfo in the URL: the image
          # ships busybox wget, whose handling of user:pass@host varies by
          # build, and a probe that fails for its own reasons is worse than no
          # probe.
          "${GF[@]}" wget -q -O - --header 'Authorization: Basic YWRtaW46Y2k=' 'http://127.0.0.1:8008/api/datasources' > ds.json
          cat ds.json
          grep -q '"type":"loki"' ds.json

          # End to end: Alloy read the docker socket, pushed to Loki, and Loki
          # can answer a query about it. Nothing above proves the middle of
          # that - Grafana is healthy whether or not anything is flowing.
          for _ in $(seq 1 40); do
            labels="$("${GF[@]}" wget -q -O - 'http://loki:3100/loki/api/v1/labels' || true)"
            echo "labels: ${labels}"
            case "${labels}" in *'"container"'*) break ;; esac
            sleep 3
          done
          case "${labels}" in *'"container"'*) ;; *) echo "loki has no container label; nothing reached it"; exit 1 ;; esac

      - name: What the observability containers said
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml ps || true
          for c in loki alloy grafana; do
            echo "::group::${c}"
            docker compose -f docker-compose.prod.yml logs --no-color "${c}" || true
            docker inspect -f '{{json .State.Health}}' "cg1618-${c}-1" || true
            echo "::endgroup::"
          done

      - name: Tear the stack down
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v || true
          rm -f .env "${GITHUB_WORKSPACE}/.ci-credentials.json"
