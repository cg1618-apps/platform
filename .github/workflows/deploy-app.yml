name: Deploy app

# The one deploy pipeline every application in cg1618-apps calls. It is
# `workflow_call` ONLY, deliberately and permanently:
#
#   * every repository in this organisation is public, and the runner it ends
#     up on is a machine in a house. A `pull_request` trigger here would let a
#     fork's pull request execute on it, which is the standard catastrophe.
#     tests/test_deploy_workflow.py fails the build if any other trigger is
#     ever added.
#   * "workflow_call only" is not access control. This repository is public,
#     so ANY repository on GitHub may call this workflow. That cannot reach
#     the box - runner resolution happens in the CALLER's context, and a
#     stranger's repository has no self-hosted runner labelled `homelab` -
#     but the sentence above should not be read as "only our repositories can
#     call it".
#   * the decision of WHAT is deployed belongs to the app: its own workflow
#     triggers on a push to its own `main` and calls this one. `main` is
#     production, and the box's checkout of that app tracks `main`, so the
#     app's trigger and that checkout are the same decision stated twice.
#
# Box-initiated by necessity. No service on the production machine publishes a
# port, its only ingress is an outbound Cloudflare Tunnel, and it has no stable
# address. GitHub cannot push, ssh or webhook into it. A self-hosted runner
# long-polls GitHub outbound instead.

on:
  workflow_call:
    inputs:
      app:
        description: The app's name, exactly as apps.yml spells it.
        required: true
        type: string
      runs_on:
        description: >-
          JSON array of runner labels. The default is the box; an app has no
          reason to change it except to aim at another self-hosted runner. It
          must never name a runner a pull request can reach.
        required: false
        type: string
        default: '["self-hosted", "homelab"]'

concurrency:
  # Per app, not global. This does not let two apps deploy at once - a
  # concurrency group is already scoped to the repository it runs in, and each
  # app has its own repository, so two apps never shared a group to begin
  # with. What naming the app buys is that the group cannot collide with
  # another group in the SAME repository, and that a queued run says which app
  # it is waiting for. One app deploying over itself is the thing that must
  # not happen.
  group: deploy-${{ inputs.app }}
  # Never cancel a deploy in flight. A cancelled run can leave the box between
  # `git pull` and `up -d --build`, which is a state no exit code describes.
  cancel-in-progress: false

jobs:
  # Runs on GitHub rather than the box: it needs only the registry and the
  # push diff, and it decides which of the two deploy jobs runs - including
  # whether the owner must approve before anything touches production.
  #
  # HOW IT DECIDES differs from the single-app workflow this replaces, which
  # grepped the push diff for `^alembic/versions/`. The platform does not know
  # any app's migration tool or layout, so it cannot grep for one. Two sources
  # answer the question instead, in order:
  #
  #   1. `apps.yml`. `migrations: false` means the app's schema never changes,
  #      and bin/deploy refuses outright if a hook turns up anyway - so no
  #      push of that app can add a migration and the ungated lane is always
  #      right.
  #   2. The app's own `deploy/migrations added <before> <after>` hook, which
  #      is the contract's answer to "what does this deploy add". Asking the
  #      app is the only app-agnostic way to keep the ungated lane alive: the
  #      alternative - gating every deploy of every app that declares
  #      migrations - would make that lane dead code, because all four apps
  #      declare `migrations: true` and most deploys are frontend and fixes.
  #
  # Everything else takes the gated lane: a zero `before`, a hook that is
  # missing or not executable, a hook that fails, a registry the runner could
  # not read, an app that is not in the registry. A needless approval prompt
  # costs one tap; a migration deployed unattended is the one failure this
  # pipeline must not have.
  #
  # None of this is authoritative and it does not need to be. bin/deploy asks
  # the same hook again on the box, against the box's own HEAD, and refuses
  # without MIGRATION_APPROVED - which catches the case this job structurally
  # cannot see: a runner offline across two merges, so that one push range
  # misses the earlier migration.
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      migration: ${{ steps.check.outputs.migration }}
    steps:
      # The app, at the pushed sha, with full history: the hook is asked about
      # the range `before...after`, and a shallow clone does not contain
      # `before`.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: app

      # The registry, from the platform repository - public, so the caller's
      # own token reads it. `main`, because the registry the box will act on
      # is the one on main, not whatever ref this workflow was called at.
      #
      # That is right only while callers pin `@main`, as the documented
      # example does. An app pinning a tag would take the WORKFLOW from the
      # tag and the REGISTRY from main, and the two could then disagree about
      # whether the app has migrations at all.
      #
      # If this repository ever goes private, the caller's token cannot read
      # it: this checkout 404s, classify fails, and both deploy lanes skip on
      # `needs`. It fails closed and loud, which is the right direction - but
      # it fails for every app at once and the message names a checkout rather
      # than a permission.
      - name: Check out the registry
        uses: actions/checkout@v4
        with:
          repository: cg1618-apps/platform
          ref: main
          path: platform

      # ubuntu-latest ships python3, and PyYAML's presence is an image detail
      # rather than a promise. Without it the lookup below fails, `gated()`
      # fires, and EVERY deploy of EVERY app takes the approval lane
      # permanently - correct and useless, in a green run.
      - name: The registry parser's one dependency
        run: python3 -m pip install --quiet "PyYAML==6.0.2"

      - id: check
        env:
          APP: ${{ inputs.app }}
          # The hook contract says PLATFORM_DIR is exported when it is called,
          # and bin/deploy and bin/rollback both do. The registry is checked
          # out here anyway, so the hook sees the same convention whether the
          # platform asks it on a runner or on the box.
          PLATFORM_DIR: ${{ github.workspace }}/platform
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          gated() {
            # ::warning:: rather than a bare echo: "I could not tell" is the
            # branch that quietly turns the approval lane into the only lane,
            # and a line in a step's log is not somewhere anyone looks at a
            # green run.
            echo "::warning::$1"
            echo "migration=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # The registry is the source of truth for whether this app has a
          # schema at all. A read that fails is not an answer, so it gates.
          declared="$(python3 -c '
          import sys, yaml
          name = sys.argv[1]
          apps = yaml.safe_load(open(sys.argv[2]))["apps"]
          match = [a for a in apps if a["name"] == name]
          if not match:
              sys.exit(f"{name} is not in apps.yml")
          entry = match[0]
          if "migrations" not in entry:
              sys.exit(f"{name} does not declare migrations: in apps.yml")
          print(str(entry["migrations"]).lower())
          ' "${APP}" platform/apps.yml)" ||
            gated "Could not read the registry; treating as a migration deploy."

          if [ "${declared}" != "true" ]; then
            echo "${APP} declares no migrations in apps.yml."
            echo "migration=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A zero `before` means no comparable range - a first push, a
          # force-push, or a branch created at this sha.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            gated "No comparable range; treating as a migration deploy."
          fi

          # -f as well as -x, because -x is true of a DIRECTORY: that would
          # pass the gate and then exit 126 on the call below.
          if [ ! -f app/deploy/migrations ] || [ ! -x app/deploy/migrations ]; then
            gated "app/deploy/migrations is not an executable file; treating as a migration deploy."
          fi

          # Asked, never inferred - and `if !` rather than a bare call,
          # because under `set -e` the hook's exit status would otherwise
          # become this step's. "I could not tell" and "there were none" are
          # opposite answers, and the second one deploys a migration
          # unattended.
          if ! incoming="$(cd app && ./deploy/migrations added "${BEFORE}" "${AFTER}")"; then
            gated "deploy/migrations added failed; treating as a migration deploy."
          fi

          if [ -n "${incoming}" ]; then
            echo "This deploy adds migrations:"
            echo "${incoming}"
            echo "migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration=false" >> "$GITHUB_OUTPUT"
          fi

  # The common case: frontend work, fixes, docs. Nothing here can lose data,
  # because the database is never modified.
  deploy:
    needs: classify
    if: needs.classify.outputs.migration == 'false'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Nothing here talks to the API: the job's whole act is running a shell
    # script on the box. Without this it inherits the caller repository's
    # default token, which is a credential sitting on a machine in a house
    # for no reason. classify needs `contents: read` and says so.
    permissions: {}
    steps:
      # No actions/checkout. The runner's workspace is ~/actions-runner/_work/
      # and the stack only works from the platform checkout at ~/cg1618 and
      # the app's own checkout beside it, where .env lives, where the bind
      # mounts are, and where COMPOSE_PROJECT_NAME decides WHICH VOLUME is the
      # real database. A deploy from the runner's own checkout would come up
      # on a brand-new empty volume while the real data sat in the old one -
      # which looks exactly like data loss.
      #
      # The exit code is captured rather than just allowed to fail the step,
      # because WHICH failure it was decides whether rolling back is correct.
      - name: Deploy
        id: deploy
        env:
          APP: ${{ inputs.app }}
        run: |
          cd "${PLATFORM_DIR:-$HOME/cg1618}"
          # classify read apps.yml from platform@main; THIS is the checkout
          # that acts. Bring it to the same place before it does, or the two
          # disagree about a migrations: declaration or about where an app's
          # checkout is, and only the run's log would say so. It ran three
          # commits behind on travel's first deploy and refused, for a reason
          # that had been fixed on main an hour earlier.
          #
          # --ff-only: a box whose platform checkout has diverged is a box
          # someone has been working on by hand, and a merge is not this
          # step's decision to make.
          git -C . fetch origin main --quiet
          git -C . checkout --quiet main
          git -C . merge --ff-only origin/main --quiet
          echo "platform: $(git rev-parse --short HEAD)"
          rc=0
          ./bin/deploy "${APP}" --ci || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      # Exit 2 only: the deploy RAN and the result is unhealthy, so the
      # database may have been migrated and the previous image is the way
      # back. Exit 1 is a refusal to start - wrong branch, no .env, an
      # unapproved migration, a registry and a repository that disagree -
      # which leaves production untouched and still serving, and where rolling
      # back would take a working site down to "recover" from nothing.
      # `if: failure()` alone cannot tell those apart.
      - name: Roll back
        if: failure() && steps.deploy.outputs.rc == '2'
        env:
          APP: ${{ inputs.app }}
        run: |
          cd "${PLATFORM_DIR:-$HOME/cg1618}"
          # Exit 3 is the one outcome that needs a person: bin/rollback froze
          # part-way and named the dump a human must decide about. Every other
          # non-zero exit is a step that went red like any other, and a red
          # step nobody distinguishes is a frozen app nobody notices.
          # tee, not a redirect: a rollback that hangs or is cancelled shows
          # nothing at all if its output is buffered into a file and cat'd at
          # the end, and a hung rollback is exactly when somebody is watching.
          # `set -o pipefail` so rc is the SCRIPT's exit code and not tee's -
          # Actions' `bash` shell sets it, and the bare `run` default does
          # not, so it is stated here rather than assumed.
          set -o pipefail
          log="$(mktemp)"
          rc=0
          ./bin/rollback "${APP}" 2>&1 | tee "${log}" || rc=$?
          if [ "${rc}" -eq 3 ]; then
            dump="$(sed -n 's/.*pre-deploy dump: *//p' "${log}" | head -1)"
            echo "::error::FROZEN - ${APP} needs a person. Pre-deploy dump: ${dump:-see the log above}. Restoring it is a human decision; it discards every write since."
          fi
          exit "${rc}"

  # Does the gate actually exist? `environment: production` on the job below
  # is the whole approval gate, and referencing an environment that does not
  # exist DOES NOT FAIL: GitHub creates it on first use, with zero protection
  # rules, and the job runs immediately. Nothing in an app's repository
  # declares the environment, so an app whose owner never configured it would
  # deploy a migration unattended, in a green run, with the gate nominally
  # present in this file.
  #
  # The second layer cannot catch that either: the job below sets
  # MIGRATION_APPROVED unconditionally, so bin/deploy's re-check on the box is
  # satisfied by the same run that skipped the approval.
  #
  # A SEPARATE JOB, not a step inside deploy-migration. A step there runs
  # AFTER the approval, so it could only ever verify a gate that already
  # worked - and would say nothing in the one case this exists for, where
  # there was no gate to wait at.
  #
  # `contents: read` is expected to be enough: these repositories are public
  # and the endpoint is a read. If it proves not to be, DO NOT reach for
  # `administration: read` - that scope is not grantable to GITHUB_TOKEN in a
  # workflow `permissions:` block, so adding it produces a syntax error
  # during an outage rather than a fix. The remedy would be a personal access
  # token in a secret, which every CALLER would then have to supply and which
  # this workflow's token bounds do not cover - so it complicates the caller
  # contract, and is worth measuring a real 403 before reaching for.
  verify-gate:
    needs: classify
    if: needs.classify.outputs.migration == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The production environment must have a required reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
                     --jq '[.protection_rules[].type] | join(",")')"
          case ",${rules}," in
            *,required_reviewers,*)
              echo "gate is armed: ${rules}"
              ;;
            *)
              echo "::error::production has no required reviewers; refusing to deploy a migration"
              exit 1
              ;;
          esac

  # Identical steps to the ungated lane, one difference: `environment:
  # production` carries a required reviewer, so this job waits for the owner
  # before it runs - and verify-gate above has already proven that reviewer
  # exists, because an unconfigured environment gates nothing while looking
  # exactly like one that does.
  #
  # The gate exists because a migration is the only class of change that can
  # destroy data, and because reversing a migration is not a restore - undoing
  # a dropped column recreates it empty. MIGRATION_APPROVED is what
  # bin/deploy's own re-check looks for, so the approval travels to the box
  # rather than living only in GitHub's audit log.
  deploy-migration:
    needs: [classify, verify-gate]
    if: needs.classify.outputs.migration == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: production
    # Same as the ungated lane: this job runs a script, it does not call the
    # API. verify-gate is the job that needs a token, and it has its own.
    permissions: {}
    steps:
      - name: Deploy
        id: deploy
        env:
          APP: ${{ inputs.app }}
          MIGRATION_APPROVED: "1"
        run: |
          cd "${PLATFORM_DIR:-$HOME/cg1618}"
          # classify read apps.yml from platform@main; THIS is the checkout
          # that acts. Bring it to the same place before it does, or the two
          # disagree about a migrations: declaration or about where an app's
          # checkout is, and only the run's log would say so. It ran three
          # commits behind on travel's first deploy and refused, for a reason
          # that had been fixed on main an hour earlier.
          #
          # --ff-only: a box whose platform checkout has diverged is a box
          # someone has been working on by hand, and a merge is not this
          # step's decision to make.
          git -C . fetch origin main --quiet
          git -C . checkout --quiet main
          git -C . merge --ff-only origin/main --quiet
          echo "platform: $(git rev-parse --short HEAD)"
          rc=0
          ./bin/deploy "${APP}" --ci || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      # Exit 2 only, for the same reason as the ungated job - and it matters
      # more here, because this is the lane where a migration has run and
      # bin/rollback may have schema to reverse.
      - name: Roll back
        if: failure() && steps.deploy.outputs.rc == '2'
        env:
          APP: ${{ inputs.app }}
        run: |
          cd "${PLATFORM_DIR:-$HOME/cg1618}"
          # Exit 3 is the one outcome that needs a person: bin/rollback froze
          # part-way and named the dump a human must decide about. Every other
          # non-zero exit is a step that went red like any other, and a red
          # step nobody distinguishes is a frozen app nobody notices.
          # tee, not a redirect: a rollback that hangs or is cancelled shows
          # nothing at all if its output is buffered into a file and cat'd at
          # the end, and a hung rollback is exactly when somebody is watching.
          # `set -o pipefail` so rc is the SCRIPT's exit code and not tee's -
          # Actions' `bash` shell sets it, and the bare `run` default does
          # not, so it is stated here rather than assumed.
          set -o pipefail
          log="$(mktemp)"
          rc=0
          ./bin/rollback "${APP}" 2>&1 | tee "${log}" || rc=$?
          if [ "${rc}" -eq 3 ]; then
            dump="$(sed -n 's/.*pre-deploy dump: *//p' "${log}" | head -1)"
            echo "::error::FROZEN - ${APP} needs a person. Pre-deploy dump: ${dump:-see the log above}. Restoring it is a human decision; it discards every write since."
          fi
          exit "${rc}"
