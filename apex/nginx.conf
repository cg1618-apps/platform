# The apex page's server. Listens on 8007 rather than 80 because that is the
# port reserved for it in the box's port map, and because the ingress routes
# http://apex:8007 - one port, written in one place, whichever end you read.
#
# Nothing is published to the host: the tunnel reaches this over the shared
# docker network like every other service.

server {
    listen 8007;
    # IPv6 explicitly, because the image cannot add it here. nginx:alpine's
    # entrypoint normally appends a `listen [::]:...` line to this file, and it
    # is mounted read-only, so that step logs "can not modify ... (read-only
    # file system?)" and carries on. BusyBox wget resolves localhost to ::1
    # first, so without this the container's own healthcheck gets a connection
    # refused from a server that is working perfectly over IPv4.
    listen [::]:8007;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is static and generated. Serve it, and answer anything else with
    # the page rather than a 404 - there is only one document here.
    location / {
        try_files $uri /index.html;
    }

    # Distinct from the page itself, so a health probe cannot pass on a stale
    # cached document or on nginx serving an error page with a 200.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
