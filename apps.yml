# The registry every application derives from. One entry per app.
#
# Adding an entry is a pull request to this repository; `bin/provision <app>`
# then creates the database and the role. The ingress, the apex page and the
# list of databases the backup job dumps are all generated from this file.
#
# `status` separates a claim from a running service. An entry reserves the
# hostname, the port and the database name the moment the app is planned - that
# is what stops a second app taking them - but only a `live` app is routed by
# the tunnel. Routing a planned app would publish a hostname that answers 502.
#
# `path` is optional and no app currently sets it: a checkout lives at
# `<apps dir>/<name>`. The key stays because an app whose checkout cannot
# live there is a thing the registry must be able to say, and saying it here
# is what stops a caller supplying a path that names one app and hands over
# another's checkout.
#
# `migrations` is a declaration, not a description. `true` means the app ships
# an executable `deploy/migrations`, and bin/deploy REFUSES when it cannot find
# one rather than deploying with no approval gate and no rollback target.
# `false` means the app's schema never changes, and a hook turning up anyway is
# a refusal too - the registry and the repository disagree, and which of them is
# right is a person's call. The key exists because silence used to mean both "I
# have no schema" and "my hook lost its mode bit".
apps:
  - name: media
    hostname: media.cg1618.com
    port: 8000
    database: media
    repo: git@github.com:cg1618-apps/media.git
    exposure: public
    health_path: /api/health
    migrations: true
    status: live
    description: Media tracker & database

  - name: food
    hostname: food.cg1618.com
    port: 8001
    database: food
    repo: git@github.com:cg1618-apps/food.git
    exposure: public
    health_path: /health
    migrations: true
    status: live
    description: Ingredients, recipes, what is cookable, and the cooking schedule
    # food is public: reads are unauthenticated and its writes sit behind
    # Access on one prefix. The app owns that definition - app/routing.py holds
    # WRITE_PREFIX and generates deploy/gated-paths from it - and this is the
    # declaration bin/deploy refuses to disagree with, exactly as it refuses
    # when `migrations` and the hook on disk disagree. bin/check-exposure
    # probes each path here for the Access redirect, which the hostname root
    # cannot answer for: a public app answers ungated at / by design, and would
    # go on doing so with the write surface wide open.
    gated_paths:
      - /api/edit

  - name: travel
    hostname: travel.cg1618.com
    port: 8002
    database: travel
    repo: git@github.com:cg1618-apps/travel.git
    # Private by default, and authenticated at the edge rather than in the app:
    # one user, no accounts, nothing to log into. NOT on the never-public list,
    # because sharing a single trip is a change this app is expected to want -
    # and a guard that has to be deleted to allow an intended change is a speed
    # bump, not a protection.
    exposure: cloudflare-access
    health_path: /api/health
    migrations: true
    status: live
    description: Packing and buying lists, transport information, and the current trip

  - name: art
    hostname: art.cg1618.com
    port: 8003
    database: art
    repo: git@github.com:cg1618-apps/art.git
    # Same as travel: private now, and expected to publish some finished work
    # later. The flip from cloudflare-access to public moves the gate from
    # Cloudflare into code, so the app's visibility checks must already work -
    # and be tested for refusal - before it happens.
    exposure: cloudflare-access
    health_path: /health
    migrations: true
    status: live
    description: Practice records, references, schedule, and the drawing roadmap

  # The box's own observability, and the first entry that is NOT an app in
  # its own repository. It is here rather than emitted unconditionally like
  # the apex page for one reason: bin/check-exposure iterates this file, so a
  # cloudflare-access hostname that is absent from it is a hostname nothing
  # probes. That is exactly how art served unauthenticated for twenty
  # minutes, and this hostname holds every application's logs.
  - name: logs
    hostname: logs.cg1618.com
    port: 8008
    # Grafana keeps its own state in a docker volume, not in the shared
    # PostgreSQL. Pointing it at `db` would put the thing that reports on an
    # outage inside the blast radius of one.
    database: null
    # null means platform-owned: this service is in THIS repository's
    # docker-compose.prod.yml, so there is no cg1618-apps/logs to clone, no
    # deploy workflow and nothing for bin/provision to do.
    # bin/validate_apps.py refuses migrations, a database or a path alongside
    # it.
    repo: null
    exposure: cloudflare-access
    health_path: /api/health
    migrations: false
    # Live. The Access application covering this hostname exists and was
    # measured from the open internet before this line changed, rather than
    # confirmed in a dashboard: an unauthenticated GET to
    # https://logs.cg1618.com answered 302 to cg1618.cloudflareaccess.com,
    # which is the redirect bin/check-exposure keys on. That ordering is the
    # protection - live first would have published an unauthenticated Grafana
    # holding four applications' logs.
    status: live
    description: Logs from every container on the box
