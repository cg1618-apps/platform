# /etc/sysctl.d/90-cg1618-panic.conf, installed by deploy/host/install.sh.
# Reboot 10 s after a kernel panic instead of sitting halted until somebody
# presses the button. Ubuntu's default, 0, means never.
kernel.panic = 10
# A CPU stuck in the kernel is turned into a panic, so the line above (and
# kdump, which Ubuntu installs) reboots the box. The hardware watchdog would be
# the answer to a freeze, but this box's firmware does not let it reset the
# board; see docs/shared-stack.md, "The hardware watchdog does not fire".
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
