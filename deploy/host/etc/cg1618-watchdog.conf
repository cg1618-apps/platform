# /etc/systemd/system.conf.d/cg1618-watchdog.conf, installed by
# deploy/host/install.sh. systemd feeds the chipset's TCO watchdog; if systemd
# stops for 30 s - a frozen kernel - the hardware resets the board.
# RebootWatchdogSec bounds a reboot that hangs on its way down.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
