# The shared half of the box: one PostgreSQL and one Cloudflare Tunnel, for
# every application. Each app runs its own compose project holding only its own
# service, and joins the `cg1618` network declared here.
#
# Run from this directory, which is where .env is loaded from:
#
#   docker compose -f docker-compose.prod.yml <command>
#
# Compose takes its project directory from the compose file's own location and
# loads `.env` from there, so this file staying at the repository root is not
# cosmetic: moved into a subdirectory it would look for that subdirectory's
# .env and silently interpolate every ${...} below to an empty string.
#
# EVERY service caps its log driver, via the `log_rotation` anchor below.
# Docker's default json-file driver has no max-size at all: the file grows
# until the disk is full, and on this box that is the shared PostgreSQL and
# every hostname going down together - slowly enough that whatever gets blamed
# will not be the cause. Both values are quoted: max-file as a YAML integer is
# rejected at start, on the box rather than in CI.
#
# This covers this file's services only. Anything started outside a compose
# file takes the daemon default, and the box has no /etc/docker/daemon.json,
# so that default is still uncapped - see docs/shared-stack.md.

# The log cap every service below takes by reference. An `x-` key is ignored
# by compose itself, which is what makes it the place to put one.
x-logging: &log_rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *log_rotation
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      cg1618:
        # `db` is what every application already connects to, and keeping it
        # means no app's configuration changes when its database moves here.
        # `postgres` is the name a new app would reach for; both resolve.
        aliases:
          - db
          - postgres
    healthcheck:
      # $$ escapes compose's own interpolation, so the shell inside the
      # container expands these rather than compose expanding them here.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *log_rotation
    # --no-autoupdate: the image is the unit of upgrade here, and an in-place
    # self-update would restart the tunnel outside anyone's knowledge.
    command: tunnel --no-autoupdate --config /etc/cloudflared/conf/config.yml run ${TUNNEL_ID}
    volumes:
      # Generated from apps.yml by bin/generate_ingress.py; CI fails if the
      # committed file and the registry disagree.
      #
      # The directory, not the file - see the apex service below for why a
      # single-file mount serves stale content after a git pull.
      #
      # A SIBLING of the credentials mount, not its parent. Mounting this
      # directory at /etc/cloudflared directly meant runc had to create the
      # credentials mountpoint INSIDE a read-only mount, which it cannot do:
      # the container failed to start with "read-only file system" and the
      # tunnel - every hostname on this box - went down with it. Nesting
      # would also require the mountpoint to exist in this directory, and
      # that file is a credential that is never committed.
      - ./cloudflared:/etc/cloudflared/conf:ro
      - ${CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    networks:
      - cg1618
    # No depends_on for the applications: they are separate compose projects
    # and compose cannot order across them. cloudflared answers 502 for a
    # hostname whose service is not up yet and recovers on its own when it is,
    # which is the correct behaviour for one tunnel serving several apps with
    # independent deploy cadences.

  apex:
    # cg1618.com. A rendering of apps.yml, generated and committed, served as
    # static files - no application code in the infrastructure repository. The
    # day it needs a backend it graduates to its own repo and its own entry.
    image: nginx:alpine
    restart: unless-stopped
    logging: *log_rotation
    volumes:
      # Directories, not single files. A file bind mount pins the INODE, and
      # `git pull` replaces the file rather than writing through it - so the
      # container keeps serving the old content while the file on disk is
      # correct, with nothing on either side saying so. That happened the day
      # travel went live: the page on disk linked to it and the page being
      # served still said "planned". Mounting the directory re-resolves the
      # name on every open.
      - ./apex/html:/usr/share/nginx/html:ro
      - ./apex/conf:/etc/nginx/conf.d:ro
    networks:
      cg1618:
        aliases:
          - apex
    healthcheck:
      # /healthz, not "/": try_files serves the page for any path, so a probe
      # against "/" cannot tell a working server from one serving a stale
      # document. nginx:alpine ships busybox wget and no curl.
      #
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first, and
      # a config mounted read-only cannot be given an IPv6 listener by the
      # image's own entrypoint. The address is pinned at both ends rather than
      # one, because either alone leaves a probe that depends on resolution
      # order.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8007/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # --- observability -------------------------------------------------------
  #
  # Three containers, one job: every container's stdout, searchable in one
  # place, surviving the deploy that recreated the container. See
  # docs/logging.md for what the applications put INTO the stream.

  loki:
    image: grafana/loki:3
    restart: unless-stopped
    logging: *log_rotation
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      # The directory, not the file - the same inode rule as everything else
      # here. See "Bind mounts are directories" in docs/shared-stack.md.
      - ./observability/loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - cg1618
    # NO healthcheck, and not by oversight. The grafana/loki image is
    # distroless: it contains the loki binary and no shell, so CMD-SHELL fails
    # with `exec: "/bin/sh": stat /bin/sh: no such file or directory`, and
    # there is no wget or curl to use with plain CMD either. A healthcheck
    # written anyway does not report "Loki is unwell" - it reports nothing,
    # forever, while the container sits at `health: starting` and every
    # `docker compose ps` looks like a Loki that never came up.
    #
    # Loki's readiness is asserted from OUTSIDE the container instead: CI
    # probes http://loki:3100/ready from the grafana container, which is on
    # this network and does have a shell.

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    logging: *log_rotation
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
      # THE DOCKER SOCKET IS ROOT ON THIS BOX. Anything that can write here
      # can start a privileged container and own the machine, so this is the
      # most trusted container in the project by some distance. `:ro` narrows
      # what the kernel allows on the socket FILE and does not make the API
      # read-only - it is honesty about intent, not a control.
      #
      # It is mounted because the alternative reads the log files under
      # /var/lib/docker/containers directly, which needs the same root and
      # gives Alloy a directory of hex ids with no container names, no compose
      # project and nothing to label a stream by.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cg1618
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    logging: *log_rotation
    environment:
      # 8008, not Grafana's default 3000, because apps.yml assigns the port
      # and bin/generate_ingress.py writes http://logs-app:8008 into the
      # tunnel from it. Two sides of one contract; see docs/shared-stack.md.
      GF_SERVER_HTTP_PORT: "8008"
      GF_SERVER_ROOT_URL: "https://logs.cg1618.com"
      # `:?` rather than a default. An unset variable would otherwise
      # interpolate to empty, Grafana would fall back to its built-in
      # admin/admin, and the container would come up looking entirely healthy.
      # Failing to start is the correct end of that.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the platform .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      cg1618:
        aliases:
          # What the generated ingress routes to. The registry calls this app
          # `logs`, and the alias is `<name>-app` like every other app's.
          - logs-app
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8008/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  cg1618:
    # Named explicitly rather than left to compose's project prefix, because
    # every application joins it by this name with `external: true`.
    name: cg1618
