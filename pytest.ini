# This repository's own tests, and only its own.
#
# The four apps are cloned INSIDE this directory (docs/setup-local.md), so a
# bare `pytest` from here used to walk into media/tests, food/tests and the
# rest. They are other repositories: they import fastapi and pydantic, which
# this repository's venv has no reason to hold, so collection failed with 119
# errors on a machine that was set up exactly as documented - and the command
# that failed is the one docs/setup-local.md tells you to run.
#
# `testpaths` rather than an exclusion list, deliberately. ruff.toml names the
# app directories one by one and has drifted: it still excludes `journal`,
# `health` and `money`, which no longer exist. A list of what to skip has to be
# edited every time an app is added or renamed; naming what to COLLECT does not,
# and is right for a fifth app on the day it is cloned.
#
# It applies only when no path is given, so `pytest media/tests` from here still
# works if that is genuinely what you meant.
[pytest]
testpaths = tests
